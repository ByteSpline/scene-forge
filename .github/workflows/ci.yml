name: CI

on:
  pull_request:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # actions/setup-dotnet adds its install directory to PATH, which is all
  # `dotnet restore`/`build`/`test` ever need (they resolve the SDK through
  # the ordinary dotnet muxer). `dotnet format` is different: it resolves
  # MSBuild via Microsoft.Build.Locator, which looks for DOTNET_ROOT first
  # and only falls back to scanning PATH - and that PATH-scan fallback is a
  # known, still-open upstream flake (dotnet/format#2218, dotnet/sdk#44957,
  # actions/setup-dotnet#564): "Unable to locate dotnet CLI. Ensure that it
  # is on the PATH." even though PATH plainly has it, since every preceding
  # step in the same job just used it successfully. setup-dotnet installs to
  # C:\Program Files\dotnet on windows-latest (its documented default
  # DOTNET_INSTALL_DIR) but does not reliably export DOTNET_ROOT itself, so
  # this workflow never had it set at all - "Verify formatting" is simply
  # the only step whose SDK-resolution path actually depends on it.
  DOTNET_ROOT: C:\Program Files\dotnet
  CI: true

jobs:
  build-and-test:
    name: Restore, build, test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SceneForge.sln

      - name: Build
        run: dotnet build SceneForge.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SceneForge.sln --no-build --configuration Release --logger "trx"

      - name: Verify formatting
        run: dotnet format SceneForge.sln --verify-no-changes

  accuracy-regression:
    name: Accuracy regression gate
    runs-on: windows-latest

    # Deliberately a separate job from build-and-test: this is the one place
    # in CI that installs real ffmpeg (every other test/job stays exactly as
    # documented - "real ffmpeg is never present in CI" - see
    # RealFfmpegAvailability's own remarks), so a slow or flaky ffmpeg
    # install can never block the main build/test gate.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Build accuracy tool
        run: dotnet build accuracy/SceneForge.Accuracy/SceneForge.Accuracy.csproj --configuration Release

      - name: Inspect Chocolatey ffmpeg install
        # Diagnostic only (never fails the job on its own) - purely so a
        # future failure of the staging step below is debuggable straight
        # from the Actions log instead of requiring a repro.
        continue-on-error: true
        run: |
          choco list ffmpeg --local-only
          Write-Host "---"
          Write-Host "avcodec-*.dll found under chocolatey's lib tree:"
          Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Recurse -Filter "avcodec-*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Stage ffmpeg next to the accuracy tool
        # `ffmpeg`/`ffprobe` on PATH after `choco install` resolve to shims
        # under C:\ProgramData\chocolatey\bin - tiny launcher stubs, not the
        # real binaries. FfmpegToolLocator deliberately never searches PATH
        # (see docs/PHASE_04_REPORT.md's convention), so this step resolves
        # the real binaries directly under C:\ProgramData\chocolatey\lib
        # instead - handling both packaging shapes Chocolatey's ffmpeg
        # package has been observed to use:
        #   1. A self-contained (statically linked) build: the exe runs
        #      standalone, no DLLs needed beside it at all. Detected by
        #      actually launching each candidate with `-version` and
        #      checking for exit code 0 - not by guessing from file layout.
        #   2. A "shared" build: the exe needs sibling DLLs (avcodec-*.dll
        #      etc.), which may or may not live in the very same folder the
        #      exe itself was found in - so on this path the whole ffmpeg
        #      package tree is searched for a folder that actually holds
        #      both the exe and an avcodec-*.dll together.
        # ffmpeg.exe and ffprobe.exe are resolved independently (same
        # two-case logic for each), since nothing here should assume they
        # necessarily end up in the same folder.
        run: |
          function Resolve-RealFfmpegBinaryDirectory {
            param(
              [string]$ExeName,
              [string]$ChocoLib
            )

            $candidates = @(Get-ChildItem -Path $ChocoLib -Recurse -Filter $ExeName -ErrorAction SilentlyContinue)
            Write-Host "Found $($candidates.Count) candidate $ExeName file(s) under $ChocoLib`:"
            $candidates | ForEach-Object { Write-Host "  $($_.FullName)" }

            if ($candidates.Count -eq 0) {
              return $null
            }

            Write-Host "Case 1: probing each candidate to see if it runs standalone (a self-contained static build)..."
            foreach ($candidate in $candidates) {
              Write-Host "  Probing $($candidate.FullName) -version ..."
              $probeExitCode = -1
              try {
                & $candidate.FullName -version *> $null
                $probeExitCode = $LASTEXITCODE
              } catch {
                Write-Host "    -> failed to launch: $($_.Exception.Message)"
                continue
              }

              if ($probeExitCode -eq 0) {
                Write-Host "    -> exit 0: self-contained static build, using as-is."
                return $candidate.DirectoryName
              }

              Write-Host "    -> exit $probeExitCode (not runnable standalone - likely needs a sibling DLL)."
            }

            Write-Host "Case 2: no candidate ran standalone - searching the ffmpeg package tree for a folder containing both $ExeName and avcodec-*.dll together..."
            $packageRoot = Join-Path $ChocoLib "ffmpeg"
            if (-not (Test-Path $packageRoot)) {
              Write-Host "  ($packageRoot not found - falling back to searching all of $ChocoLib)"
              $packageRoot = $ChocoLib
            }

            $dllCandidates = @(Get-ChildItem -Path $packageRoot -Recurse -Filter "avcodec-*.dll" -ErrorAction SilentlyContinue)
            Write-Host "  Found $($dllCandidates.Count) avcodec-*.dll file(s) under $packageRoot`:"
            $dllCandidates | ForEach-Object { Write-Host "    $($_.FullName)" }

            foreach ($dll in $dllCandidates) {
              $dllDir = $dll.DirectoryName
              if (Test-Path (Join-Path $dllDir $ExeName)) {
                Write-Host "  -> matched: $dllDir contains both $ExeName and avcodec-*.dll."
                return $dllDir
              }
            }

            return $null
          }

          $ffmpegDir = "accuracy/SceneForge.Accuracy/bin/Release/net8.0/tools/ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null

          $chocolateyRoot = $env:ChocolateyInstall
          if ([string]::IsNullOrEmpty($chocolateyRoot)) {
            $chocolateyRoot = "C:\ProgramData\chocolatey"
          }
          $chocoLib = Join-Path $chocolateyRoot "lib"
          Write-Host "Searching for the real ffmpeg/ffprobe binaries under: $chocoLib"

          Write-Host "--- Resolving ffmpeg.exe ---"
          $ffmpegRealDir = Resolve-RealFfmpegBinaryDirectory -ExeName "ffmpeg.exe" -ChocoLib $chocoLib
          if (-not $ffmpegRealDir) {
            Write-Error "Could not resolve a working ffmpeg.exe (neither standalone nor paired with avcodec-*.dll) under $chocoLib. See the 'Inspect Chocolatey ffmpeg install' step's log above for what Chocolatey actually installed."
            exit 1
          }
          Write-Host "Resolved ffmpeg.exe source directory: $ffmpegRealDir"

          Write-Host "--- Resolving ffprobe.exe ---"
          $ffprobeRealDir = Resolve-RealFfmpegBinaryDirectory -ExeName "ffprobe.exe" -ChocoLib $chocoLib
          if (-not $ffprobeRealDir) {
            Write-Error "Could not resolve a working ffprobe.exe (neither standalone nor paired with avcodec-*.dll) under $chocoLib. See the 'Inspect Chocolatey ffmpeg install' step's log above for what Chocolatey actually installed."
            exit 1
          }
          Write-Host "Resolved ffprobe.exe source directory: $ffprobeRealDir"

          $sourceDirs = @(@($ffmpegRealDir, $ffprobeRealDir) | Select-Object -Unique)
          Write-Host "Copying from $($sourceDirs.Count) distinct source directory(ies): $($sourceDirs -join ', ')"

          foreach ($dir in $sourceDirs) {
            $exeFiles = @(Get-ChildItem -Path $dir -Filter "*.exe")
            $dllFiles = @(Get-ChildItem -Path $dir -Filter "*.dll")
            Write-Host "  $($dir): copying $($exeFiles.Count) .exe file(s) and $($dllFiles.Count) .dll file(s)"
            if ($exeFiles.Count -gt 0) {
              Copy-Item -Path $exeFiles.FullName -Destination $ffmpegDir -Force
            }
            if ($dllFiles.Count -gt 0) {
              Copy-Item -Path $dllFiles.FullName -Destination $ffmpegDir -Force
            }
          }

          $stagedFfmpeg = Join-Path $ffmpegDir "ffmpeg.exe"
          $stagedFfprobe = Join-Path $ffmpegDir "ffprobe.exe"
          if (-not (Test-Path $stagedFfmpeg) -or -not (Test-Path $stagedFfprobe)) {
            Write-Error "Staging failed: ffmpeg.exe and/or ffprobe.exe missing from $ffmpegDir after copy (ffmpeg source: $ffmpegRealDir, ffprobe source: $ffprobeRealDir)."
            exit 1
          }

          Write-Host "Staged $ffmpegDir contains:"
          Get-ChildItem -Path $ffmpegDir | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Run regression gate
        # Correctness-only: fails the job only on a genuine
        # precision/recall/F1/boundary-error/false-positives-per-minute
        # regression vs. the committed baseline. Resource/throughput
        # numbers are always reported (in the console log and the uploaded
        # report) but never fail this step - see RegressionGate's remarks.
        run: dotnet run --project accuracy/SceneForge.Accuracy --configuration Release --no-build -- gate --baseline accuracy/SceneForge.Accuracy/Baselines/regression-baseline.json --report accuracy-report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: accuracy-report.json
